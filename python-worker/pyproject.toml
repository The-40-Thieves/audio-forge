[project]
name = "forge-gpu-worker"
version = "0.1.0"
description = "Ephemeral PyTorch/ONNX GPU worker for ForgeAudio (Mel-Band-RoFormer vocal separation, BS-RoFormer de-reverb, remote YuE2-3B)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "audio-separator[gpu]>=0.47.1",
    "basic-pitch>=0.4.0",
    "gradio_client>=2.7.2",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.2",
    "z3-solver>=5.3.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
