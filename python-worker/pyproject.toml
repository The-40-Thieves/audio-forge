[project]
name = "forge-gpu-worker"
version = "0.1.0"
description = "Ephemeral PyTorch/ONNX GPU worker for ForgeAudio (Mel-Band-RoFormer vocal separation, BS-RoFormer de-reverb, remote YuE2-3B)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "audio-separator>=0.47.1",
    # `audio-separator` 0.48 imports `audioread` unconditionally in `uvr_lib_v5/spec_utils.py`
    # and `vr_separator.py`, while `librosa>=1.0` dropped it on Python >=3.12.
    "audioread>=3.0.0",
    "basic-pitch>=0.4.0",
    "gradio_client>=2.7.2",
]

[project.optional-dependencies]
cpu = [
    "audio-separator[cpu]>=0.47.1",
]
gpu = [
    "audio-separator[gpu]>=0.47.1; sys_platform != 'darwin'",
    "torch>=2.10.0; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64') and python_full_version < '3.15'",
    "torchvision>=0.25.0; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64') and python_full_version < '3.15'",
]
dev = [
    "ruff>=0.17.2",
    "z3-solver>=5.3.1.0",
]
# Note: DeepFilterNet3 (`deepfilternet>=0.5.6`) pins `numpy<2.0`, which conflicts
# with `audio-separator>=0.47.1` (`numpy>=2`). Run DeepFilterNet3 in an isolated venv
# (`uv run --with deepfilternet`) or rely on the built-in Mel-Band-RoFormer denoise fallback.

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
# Exclude legacy TensorFlow/Keras/TFLite/CoreML backends pulled transitively by
# `basic-pitch 0.4.0` (which resolve vulnerable `tensorflow==2.9.0` and `keras==2.9.0`);
# `basic-pitch` runs on the worker's `onnxruntime` / `onnxruntime-gpu` backend instead.
exclude-dependencies = [
    "tensorflow",
    "tensorflow-macos",
    "tflite-runtime",
    "keras",
    "coremltools",
]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu", marker = "(sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64') and python_full_version < '3.15'" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "gpu", marker = "(sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64') and python_full_version < '3.15'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
