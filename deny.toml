# cargo-deny configuration for ForgeAudio (audio-forge)
# Enforces supply-chain security, SPDX license compliance, crate bans, and source allow-lists.
# Run locally with: cargo deny check

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
# Fail on security vulnerabilities across the full dependency graph; only fail on
# unmaintained direct workspace dependencies (transitive GUI crates like egui -> ttf-parser
# have no upstream fix yet and are reported by `cargo audit`).
unmaintained = "workspace"
ignore = [
    # Tracked in SECURITY.md: pulled in through nih_plug -> nih_log; no patched version exists.
    # Only affects Windows builds with a custom global allocator returning under-aligned memory,
    # which ForgeAudio does not ship.
    { id = "RUSTSEC-2021-0145", reason = "Transitive via nih_plug -> nih_log (atty); tracked in SECURITY.md" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # Default bundled fonts for egui's plugin GUI (nih_plug_egui -> egui -> epaint).
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
    # Steinberg VST3 C ABI bindings pulled in by nih_plug for VST3 plugin targets.
    { allow = ["GPL-3.0-only"], crate = "vst3-sys" },
]

[bans]
multiple-versions = "warn"
# Git dependencies (nih_plug, nih_plug_egui, nih_plug_xtask) are unpublished (0.0.0)
# and pinned via Cargo.lock, so cargo-deny treats version-less git specs as wildcards.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/robbert-vdh/nih-plug.git",
    "https://github.com/robbert-vdh/rust-assert-no-alloc.git",
    "https://github.com/robbert-vdh/vst3-sys.git",
    "https://github.com/RustAudio/baseview.git",
    "https://github.com/micahrj/clap-sys.git",
    "https://github.com/BillyDM/egui-baseview.git",
    "https://github.com/nicokoch/reflink.git",
]
