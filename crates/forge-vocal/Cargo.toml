[package]
name = "forge-vocal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vocal F0 pitch tracker, formant-preserving scale pitch correction, chord-aware multi-part harmony generator, and REAPER Take Pitch Envelope compiler"

[dependencies]
forge-core = { path = "../forge-core" }
forge-dsp = { path = "../forge-dsp" }
forge-theory = { path = "../forge-theory" }
rustfft.workspace = true
serde.workspace = true

[dev-dependencies]
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["warn_debug"] }
divan = { version = "6.1.0", package = "codspeed-divan-compat" }
proptest.workspace = true

[[bench]]
name = "vocal"
harness = false

[lints]
workspace = true
