---
# Codacy Static Code Analysis configuration for ForgeAudio (audio-forge)
# Focuses static analysis on production Rust and Python sources (JSFX is not analyzed by Codacy)
# while excluding vendored crates, build outputs, generated artifacts, and test fixtures.

exclude_paths:
  - "vendor/**"
  - "target/**"
  - "**/tests/**"
  - "python-worker/test_*.py"
  - "docs/**"
  - ".entire/**"
  - ".github/**"
  - "assets/**"

engines:
  clippy:
    enabled: true
  pylint:
    enabled: false
  ruff:
    enabled: true
  duplication:
    enabled: true
  metric:
    enabled: true
