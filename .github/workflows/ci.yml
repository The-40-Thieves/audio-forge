name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # System libraries nih-plug / baseview / egui need to build on Linux.
  LINUX_DEPS: >-
    libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev
    libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --no-fail-fast

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained/unsound warnings are reported but do not fail.
      - run: cargo audit

  python:
    name: python (ruff + Z3 proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.2 z3-solver==5.3.1.0
      - run: ruff check python-worker scripts
      - run: ruff format --check python-worker scripts
      # Stem picking and timeouts, with fakes for audio-separator and gradio_client.
      - run: python -m unittest discover -s python-worker -v
      - run: python scripts/verify_dsp_invariants_z3.py

  plugins:
    name: bundle plugins (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bundle
      - run: cargo xtask bundle-all --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-plugins-${{ runner.os }}
          path: |
            target/bundled/*.vst3
            target/bundled/*.clap
          if-no-files-found: error
          retention-days: 14

  validate:
    name: validate plugins (${{ matrix.os }})
    needs: plugins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PLUGINVAL_VERSION: v1.0.4
      CLAP_VALIDATOR_VERSION: 0.4.1
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: forge-plugins-${{ runner.os }}
          path: bundled

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libxcursor1 libxkbcommon0 libfreetype6

      - name: Install pluginval and clap-validator
        run: |
          set -euo pipefail
          mkdir -p tools/pluginval tools/clap-validator
          # SHA256 of each pinned release asset, computed from the downloaded files
          # (and matching the digests GitHub reports for the clap-validator assets).
          # Bump these together with the version pins; a mismatch fails the job.
          cv_build="clap-validator-${CLAP_VALIDATOR_VERSION}-127-g152b982"
          case "$RUNNER_OS" in
            Linux)
              pv_asset=pluginval_Linux.zip
              pv_sha256=c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
              cv_asset="${cv_build}-ubuntu-22.04.zip"
              cv_sha256=49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90 ;;
            Windows)
              pv_asset=pluginval_Windows.zip
              pv_sha256=c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
              cv_asset="${cv_build}-windows.zip"
              cv_sha256=d935c3af0a45c3911ea2e900f4aa5d6709dac82bb485f0c4ce28648ab2cd0c10 ;;
            macOS)
              pv_asset=pluginval_macOS.zip
              pv_sha256=3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
              cv_asset="${cv_build}-macos-universal.zip"
              cv_sha256=bbec8cd7d18274e549d5d8c12ece3cec54be966129388dd2e742b9957f2ba9f1 ;;
            *)
              echo "::error::unsupported runner OS: $RUNNER_OS"
              exit 1 ;;
          esac
          gh release download "$PLUGINVAL_VERSION" --repo Tracktion/pluginval \
            --pattern "$pv_asset" --dir tools
          gh release download "$CLAP_VALIDATOR_VERSION" --repo free-audio/clap-validator \
            --pattern "$cv_asset" --dir tools
          printf '%s  %s\n' "$pv_sha256" "tools/$pv_asset" "$cv_sha256" "tools/$cv_asset" \
            > tools/SHA256SUMS
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 -c tools/SHA256SUMS
          else
            sha256sum -c tools/SHA256SUMS
          fi
          unzip -q "tools/$pv_asset" -d tools/pluginval
          unzip -q "tools/$cv_asset" -d tools/clap-validator
          # Some clap-validator releases nest a tarball inside the zip.
          find tools/clap-validator -name '*.tar.gz' -exec tar -xzf {} -C tools/clap-validator \;

          case "$RUNNER_OS" in
            macOS)   pluginval="$PWD/tools/pluginval/pluginval.app/Contents/MacOS/pluginval" ;;
            Windows) pluginval="$PWD/tools/pluginval/pluginval.exe" ;;
            *)       pluginval="$PWD/tools/pluginval/pluginval" ;;
          esac
          clap_validator="$(find "$PWD/tools/clap-validator" -type f \
            \( -name clap-validator -o -name clap-validator.exe \) | head -n1)"
          test -f "$pluginval" && test -n "$clap_validator"
          chmod +x "$pluginval" "$clap_validator" || true
          echo "PLUGINVAL=$pluginval" >> "$GITHUB_ENV"
          echo "CLAP_VALIDATOR=$clap_validator" >> "$GITHUB_ENV"

      - name: pluginval (VST3, strictness 5)
        run: |
          set -uo pipefail
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          mkdir -p logs/pluginval
          failed=()
          for plugin in bundled/*.vst3; do
            name="$(basename "$plugin" .vst3)"
            echo "::group::pluginval $name"
            if ! run "$PLUGINVAL" --strictness-level 5 --skip-gui-tests --timeout-ms 120000 \
                --output-dir logs/pluginval --validate "$plugin"; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::pluginval failed: ${failed[*]}"
            exit 1
          fi

      - name: clap-validator (CLAP)
        if: success() || failure()
        run: |
          set -uo pipefail
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          mkdir -p logs/clap-validator
          failed=()
          for plugin in bundled/*.clap; do
            name="$(basename "$plugin" .clap)"
            echo "::group::clap-validator $name"
            if ! run "$CLAP_VALIDATOR" validate --only-failed "$plugin" 2>&1 \
                | tee "logs/clap-validator/$name.log"; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::clap-validator failed: ${failed[*]}"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-logs-${{ runner.os }}
          path: logs
          retention-days: 14
