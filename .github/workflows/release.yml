name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev
    libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - name: Test before packaging
        run: cargo test --workspace --locked
      - name: Bundle VST3 / CLAP plugins
        run: cargo xtask bundle-all --release
      - name: Build forge CLI and MCP server
        run: cargo build --release --locked -p forge-cli -p forge-mcp
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="audio-forge-${TAG}-${{ matrix.platform }}"
          mkdir -p "dist/$out/plugins" "dist/$out/bin" "dist/$out/jsfx"
          cp -R target/bundled/*.vst3 target/bundled/*.clap "dist/$out/plugins/"
          cp reaper-jsfx/*.jsfx "dist/$out/jsfx/"
          cp LICENSE README.md "dist/$out/"
          for bin in forge forge-mcp; do
            for f in "target/release/$bin" "target/release/$bin.exe"; do
              if [ -f "$f" ]; then cp "$f" "dist/$out/bin/"; fi
            done
          done
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
          else
            zip -qr "$out.zip" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
