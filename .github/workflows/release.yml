name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev
    libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: Verify license coherence
        run: node scripts/check-license-coherence.mjs
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit,cargo-deny
      - name: Security & license dependency audit
        run: |
          cargo audit
          cargo deny -L error check
      - name: Test before packaging
        run: cargo test --workspace --locked
      - name: Verify python-worker
        if: runner.os == 'Linux'
        run: |
          pip install --no-cache-dir --only-binary=:all: uv==0.11.7
          uv lock --project python-worker --check
          python3 -m unittest discover -s python-worker -v
      - name: Bundle VST3 / CLAP plugins
        run: cargo xtask bundle-all --release
      - name: Validate bundled CLAP plugins
        if: runner.os == 'Linux'
        env:
          CLAP_VALIDATOR_VERSION: 0.4.1
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cv_build="clap-validator-${CLAP_VALIDATOR_VERSION}-127-g152b982"
          cv_asset="${cv_build}-ubuntu-22.04.zip"
          cv_sha256="49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90"
          mkdir -p tools/clap-validator
          gh release download "$CLAP_VALIDATOR_VERSION" --repo free-audio/clap-validator \
            --pattern "$cv_asset" --dir tools
          printf '%s  %s\n' "$cv_sha256" "tools/$cv_asset" > tools/SHA256SUMS
          sha256sum -c tools/SHA256SUMS
          unzip -q "tools/$cv_asset" -d tools/clap-validator
          find tools/clap-validator -name '*.tar.gz' -exec tar -xzf {} -C tools/clap-validator \;
          clap_validator="$(find "$PWD/tools/clap-validator" -type f -name clap-validator | head -n1)"
          test -f "$clap_validator"
          chmod +x "$clap_validator"
          for plugin in target/bundled/*.clap; do
            xvfb-run -a "$clap_validator" validate --only-failed "$plugin"
          done
          rm -rf tools
      - name: Build forge CLI, MCP server, and ForgeStudio DAW
        run: cargo build --release --locked -p forge-cli -p forge-mcp -p forge-daw
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="audio-forge-${TAG}-${{ matrix.platform }}"
          mkdir -p "dist/$out/plugins" "dist/$out/bin" "dist/$out/jsfx" "dist/$out/python-worker"
          cp -R target/bundled/*.vst3 target/bundled/*.clap "dist/$out/plugins/"
          cp reaper-jsfx/*.jsfx "dist/$out/jsfx/"
          cp python-worker/forge_gpu_worker.py python-worker/pyproject.toml python-worker/uv.lock "dist/$out/python-worker/"
          cp LICENSE README.md "dist/$out/"
          if [ -f NOTICE ]; then cp NOTICE "dist/$out/"; fi
          for bin in forge forge-mcp forge-daw; do
            for f in "target/release/$bin" "target/release/$bin.exe"; do
              if [ -f "$f" ]; then cp "$f" "dist/$out/bin/"; fi
            done
          done
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
          else
            zip -qr "$out.zip" "$out"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
