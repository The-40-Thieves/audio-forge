[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-dsp",
    "crates/forge-vocal",
    "crates/forge-theory",
    "crates/forge-reaper",
    "crates/forge-worker",
    "crates/forge-plug",
    "crates/forge-cli",
    "crates/forge-mcp",
    "crates/forge-engine",
    "crates/forge-daw",
    "plugins/forge-opensoothe",
    "plugins/forge-openspacer",
    "plugins/forge-vocal-surgical",
    "plugins/forge-submono-tape",
    "plugins/forge-master-limiter",
    "plugins/forge-drum-trigger",
    "plugins/forge-phase-eq",
    "plugins/forge-spliteq",
    "plugins/forge-density-clipper",
    "plugins/forge-spaceverb",
    "plugins/forge-vocal-tune",
    "xtask",
]
# Vendored, patched upstream crates; see `vendor/nih-plug/PATCHES.md`
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["The 40 Thieves"]
repository = "https://github.com/The-40-Thieves/audio-forge"
description = "Open-source studio DSP, stem/vocal/MIDI surgery, music theory, and REAPER 7.82 production engine"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
inefficient_to_string = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rustfft = "6.4"
rayon = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
base64 = "0.23"
midly = "0.5"
rosc = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.27"
cap-std = "4.0"
proptest = "1.12"
hyper = { version = "1.13", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-async-rw", "schemars", "transport-streamable-http-server"] }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

# nih-plug's CLAP wrapper aborts the host on corrupt state and never asks the host to rescan
# parameter values after loading state, which fails clap-validator. Until the fixes land upstream,
# use a vendored copy of `nih_plug` at the locked upstream commit with those two fixes applied.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
