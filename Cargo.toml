[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-dsp",
    "crates/forge-vocal",
    "crates/forge-theory",
    "crates/forge-reaper",
    "crates/forge-worker",
    "crates/forge-plug",
    "crates/forge-cli",
    "crates/forge-mcp",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The 40 Thieves"]
repository = "https://github.com/The-40-Thieves/audio-forge"
description = "Open-source studio DSP, stem/vocal/MIDI surgery, music theory, and REAPER 7.82 production engine"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rustfft = "6.2"
rayon = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
midly = "0.5"
rosc = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.14"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
